# OTA Secure overlay: minisign overenie podpisu cez pinned public key file
# Pouzitie:
#   docker compose -f docker-compose.yml -f docker-compose.ota-secure.yml up -d
#
# Prerekvizita:
#   1. Vygeneruj kluce:   minisign -G -p configs/ota/minisign.pub -s configs/ota/minisign.key
#   2. Podpis manifest:  minisign -S -s configs/ota/minisign.key -m configs/ota/repo/manifest.json
services:
  dut:
    environment:
      - MINISIGN_PUBKEY_FILE=/config/minisign.pub
    volumes:
      - ./configs/ota/minisign.pub:/config/minisign.pub:ro
