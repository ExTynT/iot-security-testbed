services:
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    init: true
    user: "1883:1883"
    entrypoint: ["/bootstrap/mosquitto_entrypoint.sh"]
    command: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    networks: [iot_net]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    volumes:
      - ./scripts/mosquitto_entrypoint.sh:/bootstrap/mosquitto_entrypoint.sh:ro
      - ./configs/mqtt/baseline/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./runs/${RUN_ID}/logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - mosquitto_pub -h 127.0.0.1 -p 1883 -t telemetry/health -m ok >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  coap:
    build: ./images/coap-server
    init: true
    networks: [iot_net]
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop:
      - ALL
    command: ["sh", "-c", "coap-server -A 0.0.0.0 -v 6 2>&1 | tee /logs/coap.log"]
    volumes:
      - ./runs/${RUN_ID}/logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - coap-client -m get -B 1 coap://127.0.0.1/.well-known/core >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  ota:
    image: nginx@sha256:f46cb72c7df02710e693e863a983ac42f6a9579058a59a35f1ae36c9958e4ce0
    init: true
    user: "101:101"
    networks: [iot_net]
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /run:uid=101,gid=101,mode=0755
    cap_drop:
      - ALL
    volumes:
      - ./configs/ota/repo:/usr/share/nginx/html:ro
      - ./configs/ota/nginx-official.conf:/etc/nginx/conf.d/default.conf:ro
      - ./runs/${RUN_ID}/logs:/logs
    entrypoint: ["nginx", "-g", "daemon off;"]
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/manifest.json
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  dut:
    build: ./images/dut
    init: true
    user: "10001:10001"
    networks: [iot_net]
    depends_on:
      mosquitto:
        condition: service_healthy
      ota:
        condition: service_healthy
      ota_evil:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - OTA_BASE=http://ota:8080
    volumes:
      - ./runs/${RUN_ID}/logs:/logs
      - ./runs/${RUN_ID}/state:/state
    command: >
      sh -c "python /app/dut.py 2>&1 | tee /logs/dut.log"
    healthcheck:
      test:
        - CMD-SHELL
        - grep -q "MQTT connected rc=" /logs/dut.log
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ota_evil:
    image: nginx@sha256:f46cb72c7df02710e693e863a983ac42f6a9579058a59a35f1ae36c9958e4ce0
    init: true
    user: "101:101"
    networks: [iot_net]
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /run:uid=101,gid=101,mode=0755
    cap_drop:
      - ALL
    volumes:
      - ./configs/ota/evil:/usr/share/nginx/html:ro
      - ./configs/ota/nginx-evil.conf:/etc/nginx/conf.d/default.conf:ro
      - ./runs/${RUN_ID}/logs:/logs
    entrypoint: ["nginx", "-g", "daemon off;"]
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/manifest.json
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  attacker:
    build: ./images/attacker
    init: true
    user: "10002:10002"
    networks: [iot_net]
    depends_on:
      mosquitto:
        condition: service_healthy
      coap:
        condition: service_healthy
      ota:
        condition: service_healthy
      ota_evil:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    tty: true
    stdin_open: true
    volumes:
      - ./configs/mqtt/secure/certs:/work/certs:ro

  sniffer_mqtt:
    build: ./images/sniffer
    init: true
    network_mode: "service:mosquitto"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add: ["NET_ADMIN", "NET_RAW"]
    volumes:
      - ./runs/${RUN_ID}/pcap:/pcap
    command: ["tcpdump", "-i", "any", "-U", "-w", "/pcap/mqtt.pcap", "port 1883 or port 8883"]

  sniffer_coap:
    build: ./images/sniffer
    init: true
    network_mode: "service:coap"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add: ["NET_ADMIN", "NET_RAW"]
    volumes:
      - ./runs/${RUN_ID}/pcap:/pcap
    command: ["tcpdump", "-i", "any", "-U", "-w", "/pcap/coap.pcap", "port 5683 or port 5684"]

  sniffer_ota:
    build: ./images/sniffer
    init: true
    network_mode: "service:ota"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add: ["NET_ADMIN", "NET_RAW"]
    volumes:
      - ./runs/${RUN_ID}/pcap:/pcap
    command: ["tcpdump", "-i", "any", "-U", "-w", "/pcap/ota.pcap", "port 8080"]

  sniffer_ota_evil:
    build: ./images/sniffer
    init: true
    network_mode: "service:ota_evil"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add: ["NET_ADMIN", "NET_RAW"]
    volumes:
      - ./runs/${RUN_ID}/pcap:/pcap
    command: ["tcpdump", "-i", "any", "-U", "-w", "/pcap/ota_evil.pcap", "port 8080"]

  monitor-collector:
    build: ./images/monitor-collector
    user: "10003:10003"
    profiles: ["manual"]
    networks: [mgmt_net]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    volumes:
      - ./runs/${RUN_ID}/pcap:/pcap:ro
      - ./runs/${RUN_ID}/logs:/logs:ro
      - ./runs/${RUN_ID}/state:/state:ro
      - ./runs/${RUN_ID}/results:/results
    restart: "no"

networks:
  iot_net:
    internal: true
  mgmt_net:
    internal: true
