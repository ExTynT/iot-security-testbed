name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python tooling
        shell: bash
        run: python -m pip install --upgrade pip pytest ruff jsonschema pyyaml

      - name: Lint collector and tests
        shell: bash
        run: make lint

      - name: Run unit tests
        shell: bash
        run: make test

      - name: Run smoke test
        shell: bash
        run: make smoke-ci

      - name: Dump Docker logs on failure
        if: failure()
        shell: bash
        run: docker compose logs --no-color

      - name: Resolve smoke run id
        if: always()
        id: smoke_run
        shell: bash
        run: |
          if [ -f .env ]; then
            echo "run_id=$(grep '^RUN_ID=' .env | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload smoke artifacts
        if: always() && steps.smoke_run.outputs.run_id != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: smoke-run-artifacts
          path: |
            .env
            runs/${{ steps.smoke_run.outputs.run_id }}/logs/**
            runs/${{ steps.smoke_run.outputs.run_id }}/pcap/**
            runs/${{ steps.smoke_run.outputs.run_id }}/results/**
            runs/${{ steps.smoke_run.outputs.run_id }}/state/**

      - name: Tear down smoke environment
        if: always()
        shell: bash
        run: docker compose down --remove-orphans --volumes || true
