# CoAP secure overlay: DTLS/PSK na porte 5684, nešifrovaný endpoint 5683 sa nevytvára.
# Použitie:
#   docker compose -f docker-compose.yml -f docker-compose.coap-secure.yml up -d
#
# Prerekvizita: libcoap musí byť skompilovaný s DTLS cez OpenSSL.
# Dockerfile to robí automaticky pri prítomnosti balíka openssl-dev.
services:
  coap:
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          coap_psk="$$(tr -d '\r\n' < /run/secrets/coap_psk)" &&
          grep -q 'CoAP DTLS PSK: 5683=CLOSED 5684=DTLS+PSK' /logs/coap.log &&
          coap-client -m get -B 1 -u device01 -k "$$coap_psk"
          coaps://127.0.0.1:5684/.well-known/core >/dev/null 2>&1
    secrets:
      - coap_psk
    # Secure build vytvára iba DTLS endpoint; nešifrovaný port 5683 ostáva zatvorený bez firewallu.
    command:
      - sh
      - -c
      - |
        coap_psk="$(tr -d '\r\n' < /run/secrets/coap_psk)"
        {
          echo 'CoAP DTLS PSK: 5683=CLOSED 5684=DTLS+PSK'
          coap-server -A 0.0.0.0 -k "$$coap_psk" -h "CoAP" -v 6
        } 2>&1 | tee /logs/coap.log

secrets:
  coap_psk:
    file: ./runs/${RUN_ID}/secrets/coap_psk.txt
